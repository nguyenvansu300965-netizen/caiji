[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trade-lead-collector"
version = "0.1.0"
description = "合规的外贸企业名称与电话号码采集桌面工具"
requires-python = ">=3.8"
dependencies = [
  "PySide6>=6.8,<6.10",
  "SQLAlchemy>=2.0,<2.1",
  "httpx>=0.24,<0.28",
  "beautifulsoup4>=4.12,<5",
  "duckdb>=1.1,<1.2",
  "phonenumbers>=8.13,<9",
  "openpyxl>=3.1,<4",
]

[project.optional-dependencies]
dev = ["pytest>=7.4,<9", "pyinstaller>=6,<7"]

[project.scripts]
trade-lead-collector = "src.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
